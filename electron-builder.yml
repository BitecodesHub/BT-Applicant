appId: com.bitecodes.btapplicant
productName: BT Applicant
copyright: Copyright © 2026 Bitecodes
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  darkModeSupport: true
dmg:
  title: BT Applicant
  artifactName: ${productName}-${version}-${arch}.${ext}
